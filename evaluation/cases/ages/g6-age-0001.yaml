  - step_id: p1_s3
    depends_on:
    - p1_s2
    goal: 根据倍数关系列方程并求解
    action: solve
    input_objects: []
    output_object: years
    expression_before: null
    operation: 36+x=2(12+x)
    expression_after: x=12
    result_value: 12
    unit: 年
    required_understanding: null
