problem:
  text: 爸爸今年36岁，儿子今年12岁。多少年后爸爸的年龄是儿子的2倍？
  question: 求多少年后年龄成2倍关系
  answer_form: quantity_with_unit
  has_irrelevant_information: false
  has_implicit_condition: false
  implicit_conditions: []
objects:
- object_id: father_now
  name: 爸爸当前年龄
  type: age
  owner: null
  value: 36
  unit: 岁
  role: given
  source_span: 爸爸今年36岁
- object_id: son_now
  name: 儿子当前年龄
  type: age
  owner: null
  value: 12
  unit: 岁
  role: given
  source_span: 儿子今年12岁
- object_id: years
  name: 经过年数
  type: time
  owner: null
  value: null
  unit: 年
  role: unknown
  source_span: 多少年后
- object_id: father_future
  name: 爸爸未来年龄
  type: age
  owner: null
  value: null
  unit: 岁
  role: intermediate
  source_span: 爸爸的年龄
- object_id: son_future
  name: 儿子未来年龄
  type: age
  owner: null
  value: null
  unit: 岁
  role: intermediate
  source_span: 儿子的年龄
relationships:
- relationship_id: r1
  type: age_shift
  natural_language: 爸爸未来年龄=36+年数
  expression: father_future = father_now + years
  operands:
  - father_now
  - years
  result: father_future
  required_conditions: []
- relationship_id: r2
  type: age_shift
  natural_language: 儿子未来年龄=12+年数
  expression: son_future = son_now + years
  operands:
  - son_now
  - years
  result: son_future
  required_conditions: []
- relationship_id: r3
  type: multiple
  natural_language: 目标时间点爸爸年龄=2×儿子年龄
  expression: father_future = 2 * son_future
  operands:
  - father_future
  - son_future
  result: father_future
  required_conditions: []
unit_one:
  required: false
  object_id: null
  evidence: null
answer:
  final_value: 12
  unit: 年
  accepted_forms:
  - '12'
  - 12年
  validation_expression: 36 + 12 = 2 * (12 + 12)
  internal_only: true
