    operation: 爸爸36+x，儿子12+x
    expression_after: father_future=36+x; son_future=12+x
    result_value: null
    unit: null
    required_understanding: 经过x年，两人都增加x岁
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
