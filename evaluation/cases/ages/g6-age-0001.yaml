common_errors:
- error_id: e1
  type: time_shift
  student_expression: 36+x=2*12
  first_error_span: 2*12
  misconception: 只给爸爸年龄加x，没有给儿子加x
  diagnostic_question: x年后儿子的年龄会不会也变化？
  preferred_teaching_action: SHIFT_BOTH_AGES
- error_id: e2
  type: relation
  student_expression: 36-12=24，所以12年后
  first_error_span: '24'
  misconception: 只看年龄差，未建立目标倍数关系
  diagnostic_question: 年龄差不变能直接告诉你何时变成2倍吗？
  preferred_teaching_action: BUILD_TIMED_RATIO
teaching_boundaries:
  before_student_final_attempt:
    allowed:
    - 询问未知量应设为什么
    - 询问题目中的核心等量关系
    - 只提示当前一步，不直接给出最终答案
    forbidden:
    - 直接输出最终答案
    - 一次展示完整方程、求解过程和答案
  after_student_final_attempt:
    allowed:
    - 判断答案是否正确
    - 要求学生解释等量关系
    - 引导代回检验
    forbidden: []
understanding_checks:
  explain_why:
    prompt: 为什么方程两边的年龄都要加x？
    key_elements:
    - 同样经过x年
    - 两个人年龄同时增长
    common_weak_answers:
    - 只说“因为老师这样教”
    - 只报结果，不解释数量关系
  error_detection:
    prompt: 36+x=2×12漏掉了什么？
    error_example: 36+x=2*12
    expected_explanation: 漏掉儿子x年后的年龄变化
  micro_transfer:
    prompt: 若爸爸40岁、儿子15岁，多少年后爸爸2倍，只列方程。
    expected_answer: 40+x=2(15+x)
    changed_core_feature: 改变当前年龄
review:
  math_reviewer: null
  pedagogy_reviewer: null
  reviewed_at: null
  tool_verification_passed: true
  notes: 程序校验基础数值关系；仍需人工数学与教学审核。
type_specific:
  people:
  - object_id: father
    current_age_object_id: father_now
  - object_id: son
    current_age_object_id: son_now
  time_offset:
    value: null
    direction: future
  invariant_relationship: father_age - son_age = 24
  timed_relationship: father_now + x = 2 * (son_now + x)
