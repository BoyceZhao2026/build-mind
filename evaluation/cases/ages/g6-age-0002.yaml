common_errors:
- error_id: e1
  type: time_shift
  student_expression: 42+x=4(12+x)
  first_error_span: +x
  misconception: 把“年前”写成未来年龄
  diagnostic_question: “年前”应该比现在年龄大还是小？
  preferred_teaching_action: CLARIFY_TIME_DIRECTION
- error_id: e2
  type: time_shift
  student_expression: 42-x=4*12
  first_error_span: 4*12
  misconception: 只改变妈妈年龄，女儿年龄未同步变化
  diagnostic_question: x年前女儿是不是也年轻x岁？
  preferred_teaching_action: SHIFT_BOTH_AGES
teaching_boundaries:
  before_student_final_attempt:
    allowed:
    - 询问未知量应设为什么
    - 询问题目中的核心等量关系
    - 只提示当前一步，不直接给出最终答案
    forbidden:
    - 直接输出最终答案
    - 一次展示完整方程、求解过程和答案
  after_student_final_attempt:
    allowed:
    - 判断答案是否正确
    - 要求学生解释等量关系
    - 引导代回检验
    forbidden: []
understanding_checks:
  explain_why:
    prompt: 为什么“x年前”两个人的年龄都要减x？
    key_elements:
    - 时间同时倒退
    - 年龄差保持不变
    common_weak_answers:
    - 只说“因为老师这样教”
    - 只报结果，不解释数量关系
  error_detection:
    prompt: 方程42+x=4(12+x)描述的是过去还是未来？
    error_example: 42+x=4(12+x)
    expected_explanation: 这是x年后的关系，不是x年前
  micro_transfer:
    prompt: 若妈妈45岁、女儿15岁，问几年前妈妈4倍，只列方程。
    expected_answer: 45-x=4(15-x)
    changed_core_feature: 改变当前年龄
review:
  math_reviewer: null
  pedagogy_reviewer: null
  reviewed_at: null
