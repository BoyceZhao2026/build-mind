  notes: 程序校验基础数值关系；仍需人工数学与教学审核。
type_specific:
  people:
  - object_id: mother
    current_age_object_id: mother_now
  - object_id: daughter
    current_age_object_id: daughter_now
  time_offset:
    value: null
    direction: past
  invariant_relationship: mother_age - daughter_age = 30
  timed_relationship: mother_now - x = 4 * (daughter_now - x)
