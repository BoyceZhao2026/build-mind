problem:
  text: 妈妈今年42岁，女儿今年12岁。多少年前妈妈的年龄是女儿的4倍？
  question: 求多少年前妈妈年龄是女儿4倍
  answer_form: quantity_with_unit
  has_irrelevant_information: false
  has_implicit_condition: false
  implicit_conditions: []
objects:
- object_id: mother_now
  name: 妈妈当前年龄
  type: age
  owner: null
  value: 42
  unit: 岁
  role: given
  source_span: 妈妈今年42岁
- object_id: daughter_now
  name: 女儿当前年龄
  type: age
  owner: null
  value: 12
  unit: 岁
  role: given
  source_span: 女儿今年12岁
- object_id: years_ago
  name: 向过去的年数
  type: time
  owner: null
  value: null
  unit: 年
  role: unknown
  source_span: 多少年前
- object_id: mother_past
  name: 妈妈过去年龄
  type: age
  owner: null
  value: null
  unit: 岁
  role: intermediate
  source_span: 妈妈的年龄
- object_id: daughter_past
  name: 女儿过去年龄
  type: age
  owner: null
  value: null
  unit: 岁
  role: intermediate
  source_span: 女儿的年龄
relationships:
- relationship_id: r1
  type: age_shift
  natural_language: 妈妈过去年龄=42-x
  expression: mother_past = mother_now - years_ago
  operands:
  - mother_now
  - years_ago
  result: mother_past
  required_conditions: []
- relationship_id: r2
  type: age_shift
  natural_language: 女儿过去年龄=12-x
  expression: daughter_past = daughter_now - years_ago
  operands:
  - daughter_now
  - years_ago
  result: daughter_past
  required_conditions: []
- relationship_id: r3
  type: multiple
  natural_language: 过去某时妈妈年龄=4×女儿年龄
  expression: mother_past = 4 * daughter_past
  operands:
  - mother_past
  - daughter_past
  result: mother_past
  required_conditions: []
unit_one:
  required: false
  object_id: null
  evidence: null
answer:
  final_value: 2
  unit: 年
  accepted_forms:
  - '2'
  - 2年前
  validation_expression: 42 - 2 = 4 * (12 - 2)
  internal_only: true
solution_paths:
- path_id: path_1
  method: 设x年前并同步减去x
  age_appropriate: true
  priority: 1
  prerequisites:
  - 正确识别“年前”对应减法
  steps:
  - step_id: p1_s1
    depends_on: []
    goal: 设过去时间
    action: define
    input_objects:
    - years_ago
    output_object: years_ago
    expression_before: null
    operation: 设x年前
    expression_after: years_ago=x
    result_value: null
    unit: null
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s2
    depends_on:
    - p1_s1
    goal: 表示两人过去年龄
    action: build_relation
    input_objects:
    - mother_now
    - daughter_now
    output_object: null
    expression_before: null
    operation: 妈妈42-x，女儿12-x
    expression_after: mother_past=42-x; daughter_past=12-x
    result_value: null
    unit: null
    required_understanding: 回到x年前，两个人都减少x岁
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s3
    depends_on:
    - p1_s2
    goal: 建立4倍方程并求解
    action: solve
    input_objects: []
    output_object: years_ago
    expression_before: null
    operation: 42-x=4(12-x)
    expression_after: x=2
    result_value: 2
    unit: 年
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
    verification:
      tool: rule
      assertion: 42-2==4*(12-2)
  - step_id: p1_s4
    depends_on:
    - p1_s3
    goal: 检验过去年龄
    action: check
    input_objects: []
    output_object: null
    expression_before: null
    operation: 40岁与10岁，正好4倍
    expression_after: 40=4*10
    result_value: null
    unit: null
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
