problem:
  text: 小明先从学校出发步行，每分钟走60米。30分钟后，小华从同一地点骑车沿同一方向追赶，每分钟行90米。小华出发多少分钟后追上小明？
  question: 求小华出发后的追及时间
  answer_form: quantity_with_unit
  has_irrelevant_information: false
  has_implicit_condition: false
  implicit_conditions: []
