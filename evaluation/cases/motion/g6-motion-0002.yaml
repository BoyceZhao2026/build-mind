    forbidden: []
understanding_checks:
  explain_why:
    prompt: 为什么小明的路程要写成60(x+30)？
    key_elements:
    - 小明提前30分钟
    - 追赶期间小明仍继续走
    common_weak_answers:
    - 只说“因为老师这样教”
    - 只报结果，不解释数量关系
  error_detection:
    prompt: 如果写90x=60x，会漏掉什么？
    error_example: 90x=60x
    expected_explanation: 漏掉小明提前30分钟形成的领先路程
  micro_transfer:
    prompt: 若小明提前20分钟，其他不变，只列方程。
    expected_answer: 90x=60(x+20)
    changed_core_feature: 改变提前时间
