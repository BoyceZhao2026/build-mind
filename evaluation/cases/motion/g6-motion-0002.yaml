  - head_start
  result: distance_ming
  required_conditions: []
- relationship_id: r3
  type: difference
  natural_language: 追上时两人从同一点出发的路程相等
  expression: distance_hua = distance_ming
  operands:
  - distance_hua
  - distance_ming
  result: distance_hua
  required_conditions: []
