- object_id: traveler_a
  name: 甲
  type: person
  owner: null
  value: null
  unit: null
  role: given
  source_span: 甲
- object_id: traveler_b
  name: 乙
  type: person
  owner: null
  value: null
  unit: null
  role: given
  source_span: 乙
