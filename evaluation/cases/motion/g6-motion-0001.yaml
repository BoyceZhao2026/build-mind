  unit: 米/分钟
  role: given
  source_span: 每分钟走50米
- object_id: speed_b
  name: 乙速度
  type: speed
  owner: null
  value: 70
  unit: 米/分钟
  role: given
  source_span: 每分钟走70米
- object_id: time
  name: 相遇时间
  type: time
  owner: null
  value: null
  unit: 分钟
  role: unknown
  source_span: 几分钟后
- object_id: distance_total
  name: 两地距离
  type: distance
  owner: null
  value: 360
  unit: 米
  role: given
  source_span: 相距360米
- object_id: distance_a
  name: 甲路程
  type: distance
  owner: null
  value: null
  unit: 米
  role: intermediate
  source_span: 甲走的路程
- object_id: distance_b
  name: 乙路程
  type: distance
  owner: null
  value: null
  unit: 米
  role: intermediate
  source_span: 乙走的路程
relationships:
- relationship_id: r1
  type: distance_formula
  natural_language: 甲路程=甲速度×时间
  expression: distance_a = speed_a * time
  operands:
  - speed_a
  - time
  result: distance_a
  required_conditions: []
- relationship_id: r2
  type: distance_formula
  natural_language: 乙路程=乙速度×时间
  expression: distance_b = speed_b * time
  operands:
  - speed_b
  - time
  result: distance_b
  required_conditions: []
- relationship_id: r3
  type: sum
  natural_language: 相向相遇时两人路程和等于总距离
  expression: distance_a + distance_b = distance_total
  operands:
  - distance_a
  - distance_b
  result: distance_total
  required_conditions: []
