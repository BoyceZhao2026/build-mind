common_errors:
- error_id: e1
  type: relation
  student_expression: (70-50)x=360
  first_error_span: 70-50
  misconception: 相向相遇错用速度差
  diagnostic_question: 两个人是朝同一个方向还是彼此靠近？
  preferred_teaching_action: SELECT_SPEED_SUM
- error_id: e2
  type: object_binding
  student_expression: 50x=360
  first_error_span: 50x
  misconception: 只计算甲的路程，忽略乙也在运动
  diagnostic_question: 相遇前乙有没有走路？
  preferred_teaching_action: INCLUDE_BOTH_TRAVELERS
teaching_boundaries:
  before_student_final_attempt:
    allowed:
    - 询问未知量应设为什么
    - 询问题目中的核心等量关系
    - 只提示当前一步，不直接给出最终答案
    forbidden:
    - 直接输出最终答案
    - 一次展示完整方程、求解过程和答案
  after_student_final_attempt:
    allowed:
    - 判断答案是否正确
    - 要求学生解释等量关系
    - 引导代回检验
    forbidden: []
understanding_checks:
  explain_why:
    prompt: 为什么相向相遇要把两人的路程相加？
    key_elements:
    - 两人共同缩短间距
    - 相遇时两段路程合成总距离
    common_weak_answers:
    - 只说“因为老师这样教”
    - 只报结果，不解释数量关系
  error_detection:
    prompt: 用速度差70-50列方程适合这种相向题吗？为什么？
    error_example: (70-50)x=360
    expected_explanation: 速度差适合追及，不适合相向相遇
  micro_transfer:
    prompt: 若两地480米，速度仍50和70，只列方程。
    expected_answer: 50x+70x=480
    changed_core_feature: 改变总距离
