problem:
  text: 六年级一班和二班共植树126棵，一班比二班多24棵。两个班各植树多少棵？
  question: 求一班和二班各植树多少棵
  answer_form: quantity_with_unit
  has_irrelevant_information: false
  has_implicit_condition: false
  implicit_conditions: []
objects:
- object_id: class2
  name: 二班植树数
  type: amount
  owner: null
  value: null
  unit: 棵
  role: unknown
  source_span: 二班
- object_id: class1
  name: 一班植树数
  type: amount
  owner: null
  value: null
  unit: 棵
  role: unknown
  source_span: 一班
- object_id: total
  name: 总植树数
  type: amount
  owner: null
  value: 126
  unit: 棵
  role: given
  source_span: 共植树126棵
- object_id: diff
  name: 相差数
  type: amount
  owner: null
  value: 24
  unit: 棵
  role: given
  source_span: 多24棵
relationships:
- relationship_id: r1
  type: sum
  natural_language: 两班植树总数为126
  expression: class1 + class2 = total
  operands:
  - class1
  - class2
  result: total
  required_conditions: []
- relationship_id: r2
  type: difference
  natural_language: 一班比二班多24棵
  expression: class1 - class2 = diff
  operands:
  - class1
  - class2
  result: diff
  required_conditions: []
unit_one:
  required: false
  object_id: null
  evidence: null
answer:
  final_value:
    class1: 75
    class2: 51
  unit: 棵
  accepted_forms:
  - 一班75棵，二班51棵
  - 75棵和51棵
  validation_expression: 75 + 51 = 126; 75 - 51 = 24
  internal_only: true
solution_paths:
- path_id: path_1
  method: 设二班为 x 的方程法
  age_appropriate: true
  priority: 1
  prerequisites:
  - 识别一班是较大量
  steps:
  - step_id: p1_s1
    depends_on: []
    goal: 设二班数量并表示一班
    action: define
    input_objects:
    - class2
    - diff
    output_object: class1
    expression_before: null
    operation: 设二班x棵，一班x+24棵
    expression_after: class1=x+24
    result_value: null
    unit: null
    required_understanding: 一班比二班多24
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s2
    depends_on:
    - p1_s1
    goal: 用总数列方程
    action: build_relation
    input_objects:
    - class1
    - class2
    - total
    output_object: null
    expression_before: null
    operation: 两班合计126
    expression_after: x+(x+24)=126
    result_value: null
    unit: null
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s3
    depends_on:
    - p1_s2
    goal: 解方程
    action: solve
    input_objects: []
    output_object: class2
    expression_before: x+(x+24)=126
    operation: 解方程
    expression_after: x=51
    result_value: 51
    unit: 棵
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
    verification:
      tool: rule
      assertion: 51+(51+24)==126
  - step_id: p1_s4
    depends_on:
    - p1_s3
    goal: 求一班并检验
    action: check
    input_objects:
    - class2
    - diff
    output_object: class1
    expression_before: null
    operation: 51+24=75
    expression_after: class1=75
    result_value: 75
    unit: 棵
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
    verification:
      tool: rule
      assertion: 75+51==126 and 75-51==24
