common_errors:
- error_id: e1
  type: object_binding
  student_expression: (126-24)/2 = 75
  first_error_span: '75'
  misconception: 公式计算后把较小量与较大量对应反
  diagnostic_question: 减去相差数再除以2求到的是较大还是较小？
  preferred_teaching_action: CHECK_OBJECT_BINDING
- error_id: e2
  type: relation
  student_expression: x + 24 = 126
  first_error_span: x + 24
  misconception: 遗漏另一个班的数量
  diagnostic_question: 126棵包含几个班？
  preferred_teaching_action: CLARIFY_TOTAL
teaching_boundaries:
  before_student_final_attempt:
    allowed:
    - 询问未知量应设为什么
    - 询问题目中的核心等量关系
    - 只提示当前一步，不直接给出最终答案
    forbidden:
    - 直接输出最终答案
    - 一次展示完整方程、求解过程和答案
  after_student_final_attempt:
    allowed:
    - 判断答案是否正确
    - 要求学生解释等量关系
    - 引导代回检验
    forbidden: []
understanding_checks:
  explain_why:
    prompt: 为什么不能用x+24=126？
    key_elements:
    - 126是两班总数
    - 必须把两个班都计入
    common_weak_answers:
    - 只说“因为老师这样教”
    - 只报结果，不解释数量关系
  error_detection:
    prompt: 有人算(126-24)÷2=51，却说51是一班，错在哪里？
    error_example: (126-24)/2=51
    expected_explanation: 51是较小量二班，不是一班
  micro_transfer:
    prompt: 若一班比二班多30棵、总数仍126，只列方程。
    expected_answer: x+(x+30)=126
    changed_core_feature: 改变差值
review:
  math_reviewer: null
  pedagogy_reviewer: null
  reviewed_at: null
  tool_verification_passed: true
  notes: 程序校验基础数值关系；仍需人工数学与教学审核。
type_specific:
  larger_object_id: class1
  smaller_object_id: class2
  total_object_id: total
