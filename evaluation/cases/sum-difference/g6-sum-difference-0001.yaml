problem:
  text: 图书角有故事书和科技书共84本，科技书比故事书多18本。故事书和科技书各有多少本？
  question: 求故事书和科技书各有多少本
  answer_form: quantity_with_unit
  has_irrelevant_information: false
  has_implicit_condition: false
  implicit_conditions: []
objects:
- object_id: story_books
  name: 故事书
  type: amount
  owner: null
  value: null
  unit: 本
  role: unknown
  source_span: 故事书
- object_id: science_books
  name: 科技书
  type: amount
  owner: null
  value: null
  unit: 本
  role: unknown
  source_span: 科技书
- object_id: total_books
  name: 总本数
  type: amount
  owner: null
  value: 84
  unit: 本
  role: given
  source_span: 共84本
- object_id: difference
  name: 相差本数
  type: amount
  owner: null
  value: 18
  unit: 本
  role: given
  source_span: 多18本
relationships:
- relationship_id: r1
  type: sum
  natural_language: 故事书与科技书合计84本
  expression: story_books + science_books = total_books
  operands:
  - story_books
  - science_books
  result: total_books
  required_conditions: []
- relationship_id: r2
  type: difference
  natural_language: 科技书比故事书多18本
  expression: science_books - story_books = difference
  operands:
  - science_books
  - story_books
  result: difference
  required_conditions: []
unit_one:
  required: false
  object_id: null
  evidence: null
answer:
  final_value:
    story_books: 33
    science_books: 51
  unit: 本
  accepted_forms:
  - 故事书33本，科技书51本
  - 33本和51本
  validation_expression: 33 + 51 = 84; 51 - 33 = 18
  internal_only: true
solution_paths:
- path_id: path_1
  method: 设较小量为 x 的方程法
  age_appropriate: true
  priority: 1
  prerequisites:
  - 理解较大量=较小量+相差数
  steps:
  - step_id: p1_s1
    depends_on: []
    goal: 确定未知量并表示另一量
    action: define
    input_objects:
    - story_books
    - difference
    output_object: science_books
    expression_before: null
    operation: 设故事书为 x 本，则科技书为 x+18 本
    expression_after: science_books = x + 18
    result_value: null
    unit: null
    required_understanding: 同一个 x 表示较小量，较大量要多18本
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s2
    depends_on:
    - p1_s1
    goal: 根据总数建立方程
    action: build_relation
    input_objects:
    - story_books
    - science_books
    - total_books
    output_object: null
    expression_before: null
    operation: 两种书的数量和等于84
    expression_after: x + (x + 18) = 84
    result_value: null
    unit: null
    required_understanding: 总数关系提供等号两边相等的依据
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s3
    depends_on:
    - p1_s2
    goal: 解出故事书数量
    action: solve
    input_objects: []
    output_object: story_books
    expression_before: x + (x + 18) = 84
    operation: 解一元一次方程
    expression_after: x = 33
    result_value: 33
    unit: 本
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
    verification:
      tool: rule
      assertion: 33 + (33 + 18) == 84
  - step_id: p1_s4
    depends_on:
    - p1_s3
    goal: 求科技书并检验
    action: check
    input_objects:
    - story_books
    - difference
    output_object: science_books
    expression_before: null
    operation: 33+18=51，并检查和与差
    expression_after: science_books = 51
    result_value: 51
    unit: 本
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
    verification:
      tool: rule
      assertion: 33 + 51 == 84 and 51 - 33 == 18
solution_graph:
  nodes:
  - node_id: n1
    label: 设故事书为x
    object_ids:
    - story_books
  - node_id: n2
    label: 表示科技书
    object_ids:
    - science_books
    - difference
  - node_id: n3
    label: 利用总数列方程
    object_ids:
