schema_version: '1.0'
case_id: g6-work-rate-0001
status: draft
scope:
  subject: 数学
  grade: 六年级
  domain: 应用题
  problem_type: work_rate
  subtype: two_workers_together
  difficulty: basic
  curriculum_tags:
  - 工程问题
  - 合作效率
  - 单位1
  - 方程
source:
  origin: original
  source_reference: null
  copyright_status: cleared
problem:
  text: 一项工程，甲单独做6天完成，乙单独做3天完成。两人合作多少天可以完成？
  question: 求两人合作完成的时间
  answer_form: quantity_with_unit
  has_irrelevant_information: false
  has_implicit_condition: false
  implicit_conditions: []
objects:
- object_id: total_work
  name: 总工作量
  type: work
  owner: null
  value: 1
  unit: null
  role: given
  source_span: 一项工程
- object_id: worker_a
  name: 甲
  type: person
  owner: null
  value: null
  unit: null
  role: given
  source_span: 甲
- object_id: worker_b
  name: 乙
  type: person
  owner: null
  value: null
  unit: null
  role: given
  source_span: 乙
- object_id: time_a
  name: 甲单独时间
  type: time
  owner: null
  value: 6
  unit: 天
  role: given
  source_span: 6天完成
- object_id: time_b
  name: 乙单独时间
  type: time
  owner: null
  value: 3
  unit: 天
  role: given
  source_span: 3天完成
- object_id: eff_a
  name: 甲效率
  type: other
  owner: null
  value: 1/6
  unit: 工程/天
  role: intermediate
  source_span: 由6天完成得到
- object_id: eff_b
  name: 乙效率
  type: other
  owner: null
  value: 1/3
  unit: 工程/天
  role: intermediate
  source_span: 由3天完成得到
- object_id: together_time
  name: 合作时间
  type: time
  owner: null
  value: null
  unit: 天
  role: unknown
  source_span: 合作多少天
relationships:
- relationship_id: r1
  type: work_formula
  natural_language: 甲效率=1÷6
  expression: eff_a = total_work / time_a
  operands:
  - total_work
  - time_a
  result: eff_a
  required_conditions: []
- relationship_id: r2
  type: work_formula
  natural_language: 乙效率=1÷3
  expression: eff_b = total_work / time_b
  operands:
  - total_work
  - time_b
  result: eff_b
  required_conditions: []
- relationship_id: r3
  type: work_formula
  natural_language: 合作效率乘时间等于总工作量
  expression: (eff_a + eff_b) * together_time = total_work
  operands:
  - eff_a
  - eff_b
  - together_time
  result: total_work
  required_conditions: []
unit_one:
  required: true
  object_id: total_work
  evidence: 未给具体工作量，可把整项工程设为单位“1”
answer:
  final_value: 2
  unit: 天
  accepted_forms:
  - '2'
  - 2天
  validation_expression: (1/6 + 1/3) * 2 = 1
  internal_only: true
solution_paths:
- path_id: path_1
  method: 总工作量设为1的方程法
  age_appropriate: true
  priority: 1
  prerequisites:
  - 理解工作效率=工作量÷时间
  steps:
  - step_id: p1_s1
    depends_on: []
    goal: 把总工作量设为1并求效率
    action: identify
    input_objects:
    - total_work
    - time_a
    - time_b
    output_object: null
    expression_before: null
    operation: 甲效率1/6，乙效率1/3
    expression_after: eff_a=1/6; eff_b=1/3
    result_value: null
    unit: null
    required_understanding: 单独n天完成表示每天完成1/n
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s2
    depends_on:
    - p1_s1
    goal: 设合作时间
    action: define
    input_objects:
    - together_time
    output_object: together_time
    expression_before: null
    operation: 设合作x天
    expression_after: together_time=x
    result_value: null
    unit: null
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s3
    depends_on:
    - p1_s2
    goal: 列工作量方程并求解
    action: solve
    input_objects:
    - eff_a
    - eff_b
    - total_work
    output_object: together_time
    expression_before: null
    operation: (1/6+1/3)x=1
    expression_after: x=2
    result_value: 2
    unit: 天
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
    verification:
      tool: rule
      assertion: (1/6+1/3)*2==1
  - step_id: p1_s4
    depends_on:
    - p1_s3
    goal: 检查完成量
    action: check
    input_objects: []
    output_object: null
    expression_before: null
    operation: 2天甲完成1/3，乙完成2/3，合计1
    expression_after: 1/3+2/3=1
    result_value: null
    unit: null
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
solution_graph:
  nodes:
  - node_id: n1
    label: 总工作量设1
    object_ids:
    - total_work
  - node_id: n2
    label: 求甲乙效率
    object_ids:
    - eff_a
    - eff_b
  - node_id: n3
    label: 合作效率相加
    object_ids:
    - eff_a
    - eff_b
  - node_id: n4
    label: 列方程求时间
    object_ids:
    - together_time
  edges:
  - from: n1
    to: n2
  - from: n2
    to: n3
  - from: n3
    to: n4
  branch_rules: []
common_errors:
- error_id: e1
  type: operation
  student_expression: 6+3=9天
  first_error_span: 6+3
  misconception: 把各自完成时间直接相加
  diagnostic_question: 合作时应该合并“时间”还是每天完成的“效率”？
  preferred_teaching_action: FOCUS_ON_EFFICIENCY
- error_id: e2
  type: relation
  student_expression: (1/3-1/6)x=1
  first_error_span: 1/3-1/6
  misconception: 合作时错误使用效率差
  diagnostic_question: 两个人同时做，完成速度会相加还是相减？
  preferred_teaching_action: USE_COMBINED_EFFICIENCY
teaching_boundaries:
  before_student_final_attempt:
    allowed:
    - 询问未知量应设为什么
    - 询问题目中的核心等量关系
    - 只提示当前一步，不直接给出最终答案
    forbidden:
    - 直接输出最终答案
    - 一次展示完整方程、求解过程和答案
  after_student_final_attempt:
    allowed:
    - 判断答案是否正确
    - 要求学生解释等量关系
    - 引导代回检验
    forbidden: []
understanding_checks:
  explain_why:
    prompt: 为什么甲每天的效率可以写成1/6？
    key_elements:
    - 整项工程设为1
    - 6天均匀完成
    common_weak_answers:
    - 只说“因为老师这样教”
    - 只报结果，不解释数量关系
  error_detection:
    prompt: 合作效率为什么是1/6+1/3而不是相减？
    error_example: 1/3-1/6
    expected_explanation: 两人都在推进同一工程，完成量累加
  micro_transfer:
    prompt: 若甲8天、乙8天完成，只列方程。
    expected_answer: (1/8+1/8)x=1
    changed_core_feature: 改变独立时间
review:
  math_reviewer: null
  pedagogy_reviewer: null
  reviewed_at: null
  tool_verification_passed: true
  notes: 程序校验基础数值关系；仍需人工数学与教学审核。
type_specific:
  total_work_object_id: total_work
  total_work_normalized_value: 1
  workers:
  - object_id: worker_a
    solo_time: 6
    efficiency_expression: 1/6
  - object_id: worker_b
    solo_time: 3
    efficiency_expression: 1/3
  combined_efficiency_expression: 1/6 + 1/3
