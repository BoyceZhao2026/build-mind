    forbidden: []
understanding_checks:
  explain_why:
    prompt: 为什么方程是0.85x=272，而不是0.15x=272？
    key_elements:
    - 85%是现价率
    - 15%才是优惠率
    common_weak_answers:
    - 只说“因为老师这样教”
    - 只报结果，不解释数量关系
  error_detection:
    prompt: 小明用272÷15%求原价，错在哪里？
    error_example: 272/15%
    expected_explanation: 272是现价，不是优惠金额
  micro_transfer:
    prompt: 若七五折后售价300元，只列方程。
    expected_answer: 0.75x=300
    changed_core_feature: 改变折扣率
