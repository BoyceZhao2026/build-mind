common_errors:
- error_id: e1
  type: percentage_meaning
  student_expression: 0.15x=272
  first_error_span: '0.15'
  misconception: 把优惠率15%当成现价率
  diagnostic_question: 272元是付掉的钱还是优惠掉的钱？
  preferred_teaching_action: CLARIFY_PERCENTAGE_ROLE
- error_id: e2
  type: percentage_conversion
  student_expression: 85x=272
  first_error_span: '85'
  misconception: 把85%当85
  diagnostic_question: 85%写成小数是多少？
  preferred_teaching_action: RECALL_PERCENT_CONVERSION
teaching_boundaries:
  before_student_final_attempt:
