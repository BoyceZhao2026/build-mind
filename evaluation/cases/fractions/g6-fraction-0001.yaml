schema_version: '1.0'
case_id: g6-fraction-0001
status: draft
scope:
  subject: 数学
  grade: 六年级
  domain: 应用题
  problem_type: fraction
  subtype: remaining_known_find_unit_one
  difficulty: basic
  curriculum_tags:
  - 分数应用题
  - 单位1
  - 方程
source:
  origin: original
  source_reference: null
  copyright_status: cleared
problem:
  text: 一本书已经看了全书的3/5，还剩96页没有看。这本书一共有多少页？
  question: 求这本书的总页数
  answer_form: quantity_with_unit
  has_irrelevant_information: false
  has_implicit_condition: false
  implicit_conditions: []
objects:
- object_id: total_pages
  name: 全书页数
  type: amount
  owner: null
  value: null
  unit: 页
  role: unknown
  source_span: 全书
- object_id: read_pages
  name: 已看页数
  type: amount
  owner: null
  value: null
  unit: 页
  role: intermediate
  source_span: 看了全书的3/5
- object_id: remaining_pages
  name: 剩余页数
  type: amount
  owner: null
  value: 96
  unit: 页
  role: given
  source_span: 还剩96页
- object_id: read_fraction
  name: 已看分率
  type: other
  owner: null
  value: 3/5
  unit: null
  role: given
  source_span: 3/5
relationships:
- relationship_id: r1
  type: fraction_of
  natural_language: 已看页数是全书的3/5
  expression: read_pages = total_pages * 3/5
  operands:
  - total_pages
  - read_fraction
  result: read_pages
  required_conditions: []
- relationship_id: r2
  type: sum
  natural_language: 已看页数加剩余页数等于全书
  expression: read_pages + remaining_pages = total_pages
  operands:
  - read_pages
  - remaining_pages
  result: total_pages
  required_conditions: []
unit_one:
  required: true
  object_id: total_pages
  evidence: “全书的3/5”说明全书是单位“1”
answer:
  final_value: 240
  unit: 页
  accepted_forms:
  - '240'
  - 240页
  validation_expression: 240 * (1 - 3/5) = 96
  internal_only: true
solution_paths:
- path_id: path_1
  method: 设单位“1”为x的方程法
  age_appropriate: true
  priority: 1
  prerequisites:
  - 能找准全书是单位1
  steps:
  - step_id: p1_s1
    depends_on: []
    goal: 确定单位1
    action: identify
    input_objects:
    - total_pages
    - read_fraction
    output_object: total_pages
    expression_before: null
    operation: 把全书设为x页
    expression_after: total_pages=x
    result_value: null
    unit: null
    required_understanding: 分率3/5作用于全书
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s2
    depends_on:
    - p1_s1
    goal: 表示已看与剩余
    action: build_relation
    input_objects:
    - read_fraction
    - remaining_pages
    output_object: null
    expression_before: null
    operation: 已看3/5x，剩余x-3/5x=96
    expression_after: x - 3/5*x = 96
    result_value: null
    unit: null
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s3
    depends_on:
    - p1_s2
    goal: 解出总页数
    action: solve
    input_objects: []
    output_object: total_pages
    expression_before: null
    operation: 解2/5x=96
    expression_after: x=240
    result_value: 240
    unit: 页
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
    verification:
      tool: rule
      assertion: 240*(1-3/5)==96
  - step_id: p1_s4
    depends_on:
    - p1_s3
    goal: 代回检验
    action: check
    input_objects:
    - total_pages
    - read_fraction
    - remaining_pages
    output_object: null
    expression_before: null
    operation: 240的2/5是96
    expression_after: 240*(2/5)=96
    result_value: null
    unit: null
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
solution_graph:
  nodes:
  - node_id: n1
    label: 确定单位1
    object_ids:
    - total_pages
  - node_id: n2
    label: 表示已看3/5x
    object_ids:
    - read_pages
  - node_id: n3
    label: 用剩余96列方程
    object_ids:
    - remaining_pages
  - node_id: n4
    label: 求解检验
    object_ids:
    - total_pages
  edges:
  - from: n1
    to: n2
  - from: n2
    to: n3
  - from: n3
    to: n4
  branch_rules: []
common_errors:
- error_id: e1
  type: unit_one
  student_expression: 96 ÷ 3/5
  first_error_span: 3/5
  misconception: 把96页错当作3/5对应量
  diagnostic_question: 96页是“已看”还是“剩下”的部分？
  preferred_teaching_action: IDENTIFY_FRACTION_PART
- error_id: e2
  type: operation
  student_expression: x - 3/5 = 96
  first_error_span: 3/5
  misconception: 把分率直接从页数中相减
  diagnostic_question: 3/5表示页数还是全书的一部分比例？
  preferred_teaching_action: CLARIFY_FRACTION_MEANING
teaching_boundaries:
  before_student_final_attempt:
    allowed:
    - 询问未知量应设为什么
    - 询问题目中的核心等量关系
    - 只提示当前一步，不直接给出最终答案
    forbidden:
    - 直接输出最终答案
    - 一次展示完整方程、求解过程和答案
  after_student_final_attempt:
    allowed:
    - 判断答案是否正确
    - 要求学生解释等量关系
    - 引导代回检验
    forbidden: []
understanding_checks:
  explain_why:
    prompt: 为什么96页对应全书的2/5，而不是3/5？
    key_elements:
    - 看了3/5
    - 剩下1-3/5=2/5
    common_weak_answers:
    - 只说“因为老师这样教”
    - 只报结果，不解释数量关系
  error_detection:
    prompt: 小明列96÷3/5，他把哪一部分对应错了？
    error_example: 96/(3/5)
    expected_explanation: 96是剩余2/5对应量
  micro_transfer:
    prompt: 如果已经看了全书的1/4，还剩150页，只列方程。
    expected_answer: x-1/4*x=150
    changed_core_feature: 改变已看分率
review:
  math_reviewer: null
  pedagogy_reviewer: null
  reviewed_at: null
  tool_verification_passed: true
  notes: 程序校验基础数值关系；仍需人工数学与教学审核。
type_specific:
  unit_one_object_id: total_pages
