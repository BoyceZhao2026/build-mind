common_errors:
- error_id: e1
  type: object_binding
  student_expression: basketball=x, football=3x
  first_error_span: football=3x
  misconception: 把标准量和比较量颠倒
  diagnostic_question: “谁是谁的3倍”里谁是1倍量？
  preferred_teaching_action: IDENTIFY_BASE_AMOUNT
- error_id: e2
  type: operation
  student_expression: x+3=48
  first_error_span: '+3'
  misconception: 把3倍当成多3个
  diagnostic_question: 3倍表示乘3还是加3？
  preferred_teaching_action: CLARIFY_MULTIPLIER
teaching_boundaries:
  before_student_final_attempt:
    allowed:
    - 询问未知量应设为什么
    - 询问题目中的核心等量关系
    - 只提示当前一步，不直接给出最终答案
    forbidden:
    - 直接输出最终答案
    - 一次展示完整方程、求解过程和答案
  after_student_final_attempt:
    allowed:
    - 判断答案是否正确
    - 要求学生解释等量关系
    - 引导代回检验
    forbidden: []
understanding_checks:
  explain_why:
    prompt: 为什么足球适合设为x，而篮球写成3x？
    key_elements:
    - 足球是1倍量
    - 篮球是比较量
    common_weak_answers:
    - 只说“因为老师这样教”
    - 只报结果，不解释数量关系
  error_detection:
    prompt: 小明写x+3=48，他把哪个词理解错了？
    error_example: x+3=48
    expected_explanation: “3倍”不是“多3个”
  micro_transfer:
    prompt: 若篮球是足球4倍、总数50个，只列方程。
    expected_answer: x+4x=50
    changed_core_feature: 改变倍数
