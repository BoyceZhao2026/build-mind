problem:
  text: 体育室有篮球和足球共48个，篮球的数量是足球的3倍。篮球和足球各有多少个？
  question: 求篮球和足球各有多少个
  answer_form: quantity_with_unit
  has_irrelevant_information: false
  has_implicit_condition: false
  implicit_conditions: []
objects:
- object_id: football
  name: 足球数量
  type: amount
  owner: null
  value: null
  unit: 个
  role: unknown
  source_span: 足球
- object_id: basketball
  name: 篮球数量
  type: amount
  owner: null
  value: null
  unit: 个
  role: unknown
  source_span: 篮球
- object_id: multiplier
  name: 倍数
  type: other
  owner: null
  value: 3
  unit: null
  role: given
  source_span: 3倍
- object_id: total
  name: 球总数
  type: amount
  owner: null
  value: 48
  unit: 个
  role: given
  source_span: 共48个
relationships:
- relationship_id: r1
  type: multiple
  natural_language: 篮球是足球的3倍
  expression: basketball = football * 3
  operands:
  - football
  - multiplier
  result: basketball
  required_conditions: []
- relationship_id: r2
  type: sum
  natural_language: 两种球共48个
  expression: basketball + football = total
  operands:
  - basketball
  - football
  result: total
  required_conditions: []
unit_one:
  required: false
  object_id: null
  evidence: null
answer:
  final_value:
    football: 12
    basketball: 36
  unit: 个
  accepted_forms:
  - 足球12个，篮球36个
  validation_expression: 12 + 36 = 48; 36 = 12 * 3
  internal_only: true
solution_paths:
- path_id: path_1
  method: 设1倍量为x的方程法
  age_appropriate: true
  priority: 1
  prerequisites:
  - 能识别足球是1倍量
  steps:
  - step_id: p1_s1
    depends_on: []
    goal: 确定1倍量
    action: identify
    input_objects:
    - football
    - basketball
    - multiplier
    output_object: football
    expression_before: null
    operation: 足球是1倍量，设为x
    expression_after: football=x
    result_value: null
    unit: null
    required_understanding: “篮球是足球的3倍”中足球是标准量
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s2
    depends_on:
    - p1_s1
    goal: 表示比较量
    action: define
    input_objects:
    - football
    - multiplier
    output_object: basketball
    expression_before: null
    operation: 篮球为3x
    expression_after: basketball=3x
    result_value: null
    unit: null
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
  - step_id: p1_s3
    depends_on:
    - p1_s2
    goal: 用总数列方程并求解
    action: solve
    input_objects:
    - total
    output_object: football
    expression_before: null
    operation: x+3x=48
    expression_after: x=12
    result_value: 12
    unit: 个
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
    verification:
      tool: rule
      assertion: 12+3*12==48
  - step_id: p1_s4
    depends_on:
    - p1_s3
    goal: 求篮球并检验
    action: check
    input_objects:
    - football
    - multiplier
    output_object: basketball
    expression_before: null
    operation: 3×12=36
    expression_after: basketball=36
    result_value: 36
    unit: 个
    required_understanding: null
    allowed_hint_levels:
      L1: 提醒相关概念，不给具体算式
      L2: 聚焦题目中的关键条件
      L3: 提示应建立的关系方向
      L4: 拆出当前一个小步骤
    forbidden_before_student_attempt:
    - 直接给出本步之后的完整答案
    verification:
      tool: rule
      assertion: 36==12*3
